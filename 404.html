   localStorage; every comment is stamped with the site + page. Shadow DOM so the host site's CSS / its
   pointer-events:none form-disable can't touch it. Shows this site's prior comments at the bottom, with a
   ✓ on ones Claude resolved (read from /portfolio/resolved.json). "Export all" copies everything. */
(function () {
  var K = 'bof_feedback', D = document;
  if (D.getElementById('bof-fb-host')) return;
  function L() { try { return JSON.parse(localStorage.getItem(K)) || []; } catch (e) { return []; } }
  function SV(a) { try { localStorage.setItem(K, JSON.stringify(a)); } catch (e) {} }
  function slug() { var p = location.pathname.split('/').filter(Boolean); return p[0] || '(home)'; }
  function pagePath() { var p = location.pathname.split('/').filter(Boolean); return '/' + p.slice(1).join('/') + (p.length > 1 ? '/' : ''); }
  function ckey(c) { return c.site + '|' + (c.text || '').trim().toLowerCase(); }
  function draftKey() { return 'bof_fb_draft'; }
  function barH() { var b = D.getElementById('bof-portfolio-bar'); return b ? b.offsetHeight : 0; }
  function counts() { var a = L(), s = slug(); return { here: a.filter(function (c) { return c.site === s; }).length, total: a.length }; }
  function sync() { try { fetch('http://localhost:8799/sync', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(L()), keepalive: true }).catch(function () {}); } catch (e) {} }
  var open = localStorage.getItem('bof_fb_open') === '1', RESOLVED = {};

  var host = D.createElement('div'); host.id = 'bof-fb-host';
  host.style.cssText = 'all:initial;position:fixed;left:0;right:0;bottom:0;z-index:2147483647;pointer-events:none';
  var R = host.attachShadow({ mode: 'open' });
  R.innerHTML =
    '<style>' +
    ':host{all:initial}div,textarea,button,span,b,ul,li{box-sizing:border-box;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;margin:0}' +
    '.tog{position:fixed;right:14px;background:#0033e7;color:#fff;font-weight:700;font-size:13px;padding:9px 14px;border-radius:8px 8px 0 0;cursor:pointer;box-shadow:0 -2px 12px rgba(0,0,0,.45);pointer-events:auto;user-select:none}' +
    '.pan{position:fixed;left:0;right:0;background:#0a0a0a;border-top:2px solid #0033e7;max-height:300px;padding:8px 12px 10px;display:none;pointer-events:auto;overflow:auto}' +
    '.pan.open{display:block}' +
    '.hd{display:flex;align-items:center;gap:8px;color:#fff;font-size:12.5px;margin-bottom:6px}.hd b{color:#8bccff}.hd .pg{color:#9aa3b2}' +
    'textarea{display:block;width:100%;height:60px;background:#16181d;color:#fff;border:1px solid #2a2d35;border-radius:6px;padding:8px;font-size:13px;line-height:1.4;resize:none;pointer-events:auto;-webkit-user-select:text;user-select:text;outline:none}textarea:focus{border-color:#0033e7}' +
    '.row{display:flex;gap:8px;align-items:center;margin-top:7px}' +
    'button{border:0;border-radius:6px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;pointer-events:auto}' +
    '.save{background:#0033e7;color:#fff}.exp{background:#16181d;color:#8bccff;border:1px solid #2a2d35}.undo{background:transparent;color:#888;font-weight:600;font-size:12px;padding:6px}' +
    '.st{color:#9aa3b2;font-size:12px;margin-left:auto}' +
    '.list{margin-top:9px;border-top:1px solid #20222c;padding-top:7px}' +
    '.list .lt{color:#7a8290;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}' +
    '.list li{list-style:none;display:flex;gap:7px;align-items:flex-start;color:#cfd4dc;font-size:12.5px;line-height:1.4;padding:4px 0;border-bottom:1px solid #16181d}' +
    '.list li .ic{flex:0 0 auto;font-size:12px;width:14px}.list li.done{color:#7fce8a}.list li .ic.r{color:#36c24a}.list li .ic.p{color:#9aa3b2}' +
    '</style>' +
    '<div class="tog" id="tog"></div>' +
    '<div class="pan" id="pan">' +
    '<div class="hd">Commenting on <b id="site"></b><span class="pg" id="pg"></span></div>' +
    '<textarea id="ta" placeholder="Type feedback for THIS page, then Save…"></textarea>' +
    '<div class="row"><button class="save" id="save">Save</button><button class="undo" id="undo">Undo last</button><button class="exp" id="exp">Export all</button><span class="st" id="st"></span></div>' +
    '<div class="list" id="list" style="display:none"><div class="lt" id="lt"></div><ul id="ul"></ul></div>' +
    '</div>';
  D.body.appendChild(host);

  var tog = R.getElementById('tog'), pan = R.getElementById('pan'), ta = R.getElementById('ta');
  R.getElementById('site').textContent = slug(); R.getElementById('pg').textContent = pagePath();
  ta.value = localStorage.getItem(draftKey()) || '';
  ta.addEventListener('input', function () { localStorage.setItem(draftKey(), ta.value); });

  function renderList() {
    var s = slug(), mine = L().filter(function (c) { return c.site === s; });
    var box = R.getElementById('list'), ul = R.getElementById('ul'), lt = R.getElementById('lt');
    if (!mine.length) { box.style.display = 'none'; return; }
    box.style.display = 'block';
    lt.textContent = 'Your comments on ' + s + ' (' + mine.length + ')';
    ul.innerHTML = '';
    mine.forEach(function (c) {
      var done = !!RESOLVED[ckey(c)];
      var li = D.createElement('li'); if (done) li.className = 'done';
      li.innerHTML = '<span class="ic ' + (done ? 'r' : 'p') + '">' + (done ? '✓' : '•') + '</span><span>' + c.text.replace(/[<>&]/g, '') + (done ? '  <i style="color:#7fce8a;font-style:normal">— resolved</i>' : '') + '</span>';
      ul.appendChild(li);
    });
  }
  function refresh() {
    var h = barH(), c = counts();
    pan.style.bottom = h + 'px'; pan.classList.toggle('open', open);
    tog.style.bottom = (open ? Math.min(pan.offsetHeight || 200, 300) + h : h) + 'px';
    tog.textContent = '💬 Feedback (' + c.total + ') ' + (open ? '▾' : '▴');
    R.getElementById('st').textContent = c.here + ' on this site · ' + c.total + ' total';
    renderList();
  }
  tog.addEventListener('click', function () { open = !open; localStorage.setItem('bof_fb_open', open ? '1' : '0'); refresh(); if (open) setTimeout(function () { ta.focus(); }, 0); });
  R.getElementById('save').addEventListener('click', function () {
    var t = ta.value.trim(); if (!t) return;
    var a = L(); a.push({ site: slug(), page: location.pathname, text: t, ts: new Date().toISOString() }); SV(a);
    ta.value = ''; localStorage.removeItem(draftKey()); refresh(); sync();
    var b = R.getElementById('save'); b.textContent = 'Saved ✓ ' + slug(); setTimeout(function () { b.textContent = 'Save'; }, 1100);
  });
  R.getElementById('undo').addEventListener('click', function () { var a = L(); if (!a.length) return; a.pop(); SV(a); refresh(); sync(); });
  R.getElementById('exp').addEventListener('click', function () {
    var a = L(); if (!a.length) { alert('No comments saved yet.'); return; }
    var txt = 'PORTFOLIO FEEDBACK (' + a.length + ' comments)\n\n' + a.map(function (c) { return '[' + c.site + c.page + ']\n' + c.text; }).join('\n\n');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function () { alert('Copied ' + a.length + ' comments — paste to Claude.'); }, function () { window.prompt('Copy all (Cmd+C):', txt); });
    else window.prompt('Copy all (Cmd+C):', txt);
  });
  // load Claude's resolved-comment list (cross-path same origin) so resolved items show a ✓
  fetch('/portfolio/resolved.json', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : []; }).then(function (arr) {
    (arr || []).forEach(function (k) { RESOLVED[String(k).toLowerCase()] = 1; }); renderList();
  }).catch(function () {});
  window.addEventListener('resize', refresh);
  if (D.readyState !== 'loading') { refresh(); sync(); } else D.addEventListener('DOMContentLoaded', function () { refresh(); sync(); });
})();
</script><!-- /bof-portfolio-bar --></body>
